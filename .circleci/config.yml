version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: "Install System Dependencies"
          command: |
            sudo apt-get update
            sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm zip python3
      - run:
          name: "Download Proton Clang"
          command: |
            cd ..
            git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-stable
      - run:
          name: "Compile Kernel"
          command: |
            cd kernel-6.6
            export PARENT_DIR=$(readlink -f ..)
            export ARCH=arm64
            export SUBARCH=arm64
            
            # Setup Paths
            export CLANG_DIR=$PARENT_DIR/clang-stable
            export PATH=$CLANG_DIR/bin:$PATH
            
            # Proton Clang integrated variables
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            export LLVM=1
            export LLVM_IAS=1
            
            mkdir -p out
            make O=out ARCH=arm64 afaneh_a34x_defconfig
            make O=out ARCH=arm64 -j$(nproc) CC=clang
      - run:
          name: "Package AnyKernel3"
          command: |
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            cp kernel-6.6/out/arch/arm64/boot/Image.gz AnyKernel3/ || cp kernel-6.6/out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 ../A34-TouchFix-$(date +%Y%m%d).zip *
      - store_artifacts:
          path: A34-TouchFix-*.zip
          destination: builds

workflows:
  version: 2
  build_and_package:
    jobs:
      - build