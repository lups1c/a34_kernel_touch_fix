- run:
          name: "Download Public Android Toolchain"
          command: |
            cd ..
            # Downloading official Google Clang (r450784d) - Public and works for 6.6
            git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-stable
            git clone --depth=1 --branch android-9.0.0_r59 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-linux-android-4.9
      - run:
          name: "Compile Kernel"
          command: |
            cd kernel-6.6
            export PARENT_DIR=$(readlink -f ..)
            export ARCH=arm64
            export SUBARCH=arm64
            
            # Google's repo has many versions; we pick the modern one inside the folder
            export CLANG_DIR=$PARENT_DIR/clang-stable/clang-r450784d
            export GCC_DIR=$PARENT_DIR/aarch64-linux-android-4.9
            
            export CROSS_COMPILE=$GCC_DIR/bin/aarch64-linux-android-
            export CLANG_TRIPLE=aarch64-linux-gnu-
            
            # Set the Path
            export PATH=$CLANG_DIR/bin:$GCC_DIR/bin:$PATH
            
            export LLVM=1
            export LLVM_IAS=1
            
            mkdir -p out
            make O=out ARCH=arm64 afaneh_a34x_defconfig
            make O=out ARCH=arm64 -j$(nproc)