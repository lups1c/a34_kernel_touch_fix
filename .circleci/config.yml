version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: "Full Kernel Build"
          command: |
            # 1. Install Dependencies
            sudo apt-get update
            sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm zip python3
            
            # 2. Download Proton Clang (Modern & Public)
            cd ..
            git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-stable
            export CLANG_PATH=$(readlink -f clang-stable)
            
            # 3. Compile
            cd project/kernel-6.6
            mkdir -p out
            
            # FORCE the PATH so it finds Proton Clang (Version 13+) first
            export PATH=$CLANG_PATH/bin:$PATH
            
            # Set Variables for Kernel 6.6
            export ARCH=arm64
            export SUBARCH=arm64
            export CC=clang
            export NM=llvm-nm
            export OBJCOPY=llvm-objcopy
            export OBJDUMP=llvm-objdump
            export STRIP=llvm-strip
            export AR=llvm-ar
            export LD=ld.lld
            export LLVM=1
            export LLVM_IAS=1
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

            # Verify version (This should show 13.0.0 or higher in your logs)
            clang --version
            
            make O=out ARCH=arm64 afaneh_a34x_defconfig
            make O=out ARCH=arm64 -j$(nproc)
            
            # 4. Package
            cd ..
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            cp kernel-6.6/out/arch/arm64/boot/Image.gz AnyKernel3/ || cp kernel-6.6/out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 ../A34-TouchFix-$(date +%Y%m%d).zip *
      - store_artifacts:
          path: A34-TouchFix-*.zip
          destination: builds

workflows:
  build_kernel:
    jobs:
      - build