version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: "Install System Dependencies"
          command: |
            sudo apt-get update
            sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm zip python3
      - run:
          name: "Download Modern Toolchain"
          command: |
            cd ..
            # Getting a newer Clang for Kernel 6.6
            git clone --depth=1 https://gitlab.com/tony_ark/prebuilts_clang_host_linux-x86_clang-r416183b clang-stable
            git clone --depth=1 --branch android-9.0.0_r59 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-linux-android-4.9
      - run:
          name: "Compile Kernel"
          command: |
            cd kernel-6.6
            export PARENT_DIR=$(readlink -f ..)
            export ARCH=arm64
            export SUBARCH=arm64
            
            export CLANG_DIR=$PARENT_DIR/clang-stable
            export GCC_DIR=$PARENT_DIR/aarch64-linux-android-4.9
            
            export CROSS_COMPILE=$GCC_DIR/bin/aarch64-linux-android-
            export CLANG_TRIPLE=aarch64-linux-gnu-
            
            # This puts our new Clang ahead of the old system version
            export PATH=$CLANG_DIR/bin:$GCC_DIR/bin:$PATH
            
            export LLVM=1
            export LLVM_IAS=1
            
            mkdir -p out
            make O=out ARCH=arm64 afaneh_a34x_defconfig
            make O=out ARCH=arm64 -j$(nproc)
      - run:
          name: "Package AnyKernel3"
          command: |
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            # Grab the compiled image from the out folder
            cp kernel-6.6/out/arch/arm64/boot/Image.gz AnyKernel3/ || cp kernel-6.6/out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 ../A34-TouchFix-$(date +%Y%m%d).zip *
      - store_artifacts:
          path: A34-TouchFix-*.zip
          destination: builds